name: build

# Branch pushes and pull requests only build. Pushing a tag releases:
#   vX.Y.Z        on main's Minecraft version: creates release X.Y.Z, marks it latest.
#   vX.Y.Z+<mc>   on a mc/* branch: adds that branch's jar to the existing release.
# A tag run uses the workflow from the tagged commit, so every mc/* branch needs this
# file. Without it a tag there builds and silently releases nothing.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and upload again (e.g. v1.4.0+26.2)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      # The tag names the release, gradle.properties decides the Minecraft version.
      # Jars are named <mod version>+<minecraft version>, which UpdateChecker matches
      # on, so every branch can upload into the same release without colliding.
      - name: Resolve release version
        id: release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(\+(.+))?$ ]]; then
            echo "::error::Tag $TAG is neither vX.Y.Z nor vX.Y.Z+<minecraft version>"
            exit 1
          fi
          VERSION=${BASH_REMATCH[1]}
          EXPECTED=${BASH_REMATCH[3]}

          # A plain tag must match main's version. That's not the same as being on
          # main: hotfixes like 1.3.1 are tagged on a side branch.
          if [ -z "$EXPECTED" ]; then
            git fetch --quiet --depth=1 origin "$DEFAULT_BRANCH"
            EXPECTED=$(git show FETCH_HEAD:gradle.properties | sed -n 's/^minecraft_version=//p')
          fi
          MC=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          if [ "$MC" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG is for Minecraft $EXPECTED, but this commit builds Minecraft $MC"
            exit 1
          fi

          echo "GRADLE_VERSION_ARG=-Pmod_version=$VERSION+$MC" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build $GRADLE_VERSION_ARG

      - name: Keep jar for publishing
        if: steps.release.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 1

  # One release per mod version, holding a jar per supported Minecraft version.
  publish:
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Serializes the rewrites of the release body. The queue matters: by default a
    # group keeps a single pending run and cancels it when the next one arrives, so
    # tags pushed together would lose jars.
    concurrency:
      group: release-${{ needs.build.outputs.version }}
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: v${{ needs.build.outputs.version }}
    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist

      # Only the plain tag creates the release, so latest is set here and nowhere else.
      - name: Create release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          if [ "$TAG" != "$RELEASE_TAG" ]; then
            echo "::error::Release $RELEASE_TAG doesn't exist yet. Push tag $RELEASE_TAG first, wait for its run to finish, then re-run this job."
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$VERSION" --notes "" --latest

      - name: Upload jar
        run: gh release upload "$RELEASE_TAG" dist/*.jar --clobber

      # Rebuilt from the release's assets on every run. The markers keep it in place
      # and leave any notes around it alone.
      - name: Update download table
        shell: bash
        run: |
          PREFIX="cubecraft-plus-$VERSION+"
          {
            echo '<!-- downloads -->'
            echo '## Download'
            echo
            echo '| Minecraft | File |'
            echo '|---|---|'
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
              | grep -F "$PREFIX" \
              | sort -rV \
              | while read -r name; do
                  mc=${name#"$PREFIX"}
                  echo "| ${mc%.jar} | [\`$name\`](https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/${name//+/%2B}) |"
                done
            echo
            echo '<!-- /downloads -->'
          } > table.md

          gh release view "$RELEASE_TAG" --json body --jq .body > body.md
          awk '
            function table() { while ((getline line < "table.md") > 0) print line }
            /^<!-- downloads -->/ { table(); skip = 1; found = 1 }
            !skip { print }
            /^<!-- \/downloads -->/ { skip = 0 }
            END { if (!found) { print ""; table() } }
          ' body.md > notes.md

          # An edit that doesn't mention latest must not move it. If this isn't the
          # latest release, say so explicitly, in case the API defaults it to true.
          LATEST_ARG=()
          if [ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" != "$RELEASE_TAG" ]; then
            LATEST_ARG=(--latest=false)
          fi
          gh release edit "$RELEASE_TAG" --notes-file notes.md "${LATEST_ARG[@]}"
