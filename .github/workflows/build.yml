name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Mod version (e.g. 1.2.0)'
        required: true
      latest:
        description: 'Mark this release as the latest'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      # The branch decides which Minecraft version this is, never whoever dispatched
      # the run. Jars are named <mod version>+<minecraft version> so every branch can
      # upload into the same release without colliding.
      - name: Resolve release version
        if: github.event_name == 'workflow_dispatch'
        run: |
          MC=$(grep -m1 '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$MC" ]; then
            echo "No minecraft_version in gradle.properties" >&2
            exit 1
          fi
          echo "Releasing ${{ inputs.version }} for Minecraft $MC"
          echo "GRADLE_VERSION_ARG=-Pmod_version=${{ inputs.version }}+$MC" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build $GRADLE_VERSION_ARG

      # action-gh-release does not support "!" exclusion globs, so drop the
      # sources jar before uploading instead.
      - name: Remove sources jar
        if: github.event_name == 'workflow_dispatch'
        run: rm -f build/libs/*-sources.jar

      # One release per mod version, holding a jar per supported Minecraft version.
      # The first branch to release creates it, the rest add their jar to it.
      - name: Upload to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ${{ inputs.version }}
          make_latest: ${{ inputs.latest }}
          files: build/libs/*.jar
